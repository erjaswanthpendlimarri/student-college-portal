<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CampusConnect</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-body">


    <div class="auth-container">


        <!-- LEFT -->

        <div class="auth-info">

            <div class="auth-logo">
                🎓 CampusConnect
            </div>

            <h1>
                Start Your Career Journey 🚀
            </h1>

            <p>
                Create your account and discover jobs and internships.
            </p>


            <div class="auth-features">

                <div>✓ Student Career Profile</div>

                <div>✓ Job Opportunities</div>

                <div>✓ Internship Opportunities</div>

                <div>✓ Application Tracking</div>

            </div>

        </div>


        <!-- REGISTER -->

        <div class="auth-card register-card">

            <h2>Create Account</h2>

            <p class="auth-subtitle">
                Register on CampusConnect
            </p>


            <form id="registerForm">


                <label>Register As</label>

                <select id="registerRole" required>

                    <option value="student">
                        Student
                    </option>

                    <option value="company">
                        Company
                    </option>

                </select>


                <label>Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >


                <label>Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>Phone</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                >


                <div id="studentFields">

                    <label>College</label>

                    <input
                        type="text"
                        id="college"
                        placeholder="Enter college name"
                    >


                    <label>Course</label>

                    <input
                        type="text"
                        id="course"
                        placeholder="Example: B.Tech CSE"
                    >


                    <label>Graduation Year</label>

                    <select id="graduationYear">

                        <option value="">
                            Select Year
                        </option>

                        <option>2027</option>
                        <option>2028</option>
                        <option>2029</option>
                        <option>2030</option>

                    </select>

                </div>


                <label>Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create password"
                    required
                >


                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >


                <label class="terms-label">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    I agree to the Terms and Conditions

                </label>


                <button
                    type="submit"
                    class="btn primary-btn full-btn"
                >
                    Create Account
                </button>


            </form>


            <p class="auth-bottom">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <a href="index.html" class="back-home">
                ← Back to Home
            </a>


        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
